name: Quality

on:
  push:
    branches:
      - agentic_web_design
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://carloschd24.github.io' }}
  SITE_INDEXING: ${{ vars.SITE_INDEXING || 'false' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Component tests
        run: npm run test:component

      - name: Production build
        run: npm run build

      - name: Validate static export
        run: npm run validate:export

      - name: Validate reviewed transitive dependency baseline
        run: npm run validate:security-baseline

      - name: Validate indexable SEO mode
        env:
          NEXT_PUBLIC_SITE_URL: https://carloschd24.github.io
          SITE_INDEXING: "true"
        run: npm run build && npm run validate:export

      - name: Route, responsive, and accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  build-pages:
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'CarlosCHD24/CarlosCHD24.github.io'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Validate static export
        run: npm run validate:export

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/out

  deploy-pages:
    if: >-
      vars.PAGES_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'CarlosCHD24/CarlosCHD24.github.io'
    needs: build-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

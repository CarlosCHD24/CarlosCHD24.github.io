name: Maintenance

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links-and-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_SITE_URL: https://carloschd24.github.io
      SITE_INDEXING: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build indexable production export
        run: npm run build

      - name: Validate social metadata, JSON-LD, and indexing
        run: npm run validate:export

      - name: Check published external links
        run: npm run check:links

  dependency-security-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate reviewed transitive dependency baseline
        working-directory: frontend
        run: npm run validate:security-baseline | tee -a "${GITHUB_STEP_SUMMARY}"
